<svg viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bs-grad-or3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#F5D97A"/>
      <stop offset="45%"  stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
  </defs>
  <!-- Carré blanc avec bordure or dégradé -->
  <rect x="15" y="15" width="230" height="230" rx="46" fill="#FFFFFF" stroke="url(#bs-grad-or3)" stroke-width="5"/>
  <!-- Éclat subtil crème -->
  <rect x="20" y="20" width="220" height="82" rx="37" fill="#FBF8ED" opacity="0.5"/>
  <!-- B en dégradé or - taille dominante -->
  <text x="118" y="187"
        font-family="Helvetica, Arial, sans-serif"
        font-weight="900"
        font-size="185"
        fill="url(#bs-grad-or3)"
        text-anchor="middle">B</text>
  <!-- 3 barres horizontales dorées empilées -->
  <rect x="188" y="118" width="42" height="12" rx="2.5" fill="url(#bs-grad-or3)"/>
  <rect x="188" y="139" width="32" height="12" rx="2.5" fill="#C9A227"/>
  <rect x="188" y="160" width="22" height="12" rx="2.5" fill="#C9A227" opacity="0.65"/>
  <!-- S positionné juste au-dessus de la 1re barre, plus imposant -->
  <text x="209" y="112"
        font-family="Helvetica, Arial, sans-serif"
        font-weight="900"
        font-size="44"
        letter-spacing="-1"
        fill="url(#bs-grad-or3)"
        text-anchor="middle">S</text>
</svg>
